[build]
  command = "npm run build:client"
  publish = "dist/spa"

# Per-locale privacy-policy redirects are generated into dist/spa/_redirects by scripts/prerender.mjs.

# SPA fallback — routes without a pre-rendered page serve the untouched shell
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
